name: Build SURYA RECORDER APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project
        id: find
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR=.
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n1)
            if [ -z "$ZIP" ]; then echo "No project zip found in repo root"; exit 1; fi
            mkdir -p _proj && unzip -q -o "$ZIP" -d _proj
            DIR=$(dirname "$(find _proj -name settings.gradle.kts | head -n1)")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SuryaRecorder-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
